replicaCount: 3

image:
  tag: "1.0.0"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sample-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-app-tls
      hosts:
        - sample-app.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

env:
  ENVIRONMENT: production
  PORT: "8080"
