replicaCount: 1

image:
  tag: "1.0.0"

ingress:
  enabled: true
  hosts:
    - host: sample-app-staging.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  ENVIRONMENT: staging
  PORT: "8080"
