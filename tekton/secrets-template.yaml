# WARNING: Do NOT commit actual secret values to git.
# Use this as a reference for required secrets, then create them with:
#   kubectl create secret generic <name> -n tekton-pipelines --from-literal=...

---
# GitHub webhook HMAC secret — set when configuring the GitHub webhook
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: tekton-pipelines
type: Opaque
stringData:
  secret: REPLACE_WITH_WEBHOOK_SECRET

---
# Container registry credentials (.dockerconfigjson format)
# Create with: kubectl create secret docker-registry registry-credentials \
#   -n tekton-pipelines \
#   --docker-server=ghcr.io \
#   --docker-username=<user> \
#   --docker-password=<token>
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: tekton-pipelines
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG

---
# SSH key for pushing GitOps commits back to the repository
# Create with: kubectl create secret generic git-ssh-credentials \
#   -n tekton-pipelines \
#   --from-file=id_rsa=/path/to/private-key \
#   --from-file=known_hosts=/path/to/known_hosts
apiVersion: v1
kind: Secret
metadata:
  name: git-ssh-credentials
  namespace: tekton-pipelines
type: Opaque
data:
  id_rsa: REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY
  known_hosts: REPLACE_WITH_BASE64_ENCODED_KNOWN_HOSTS
