apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push-image
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/tags: kaniko, image-build
spec:
  description: Build a container image with Kaniko and push to a registry.

  params:
    - name: image
      type: string
      description: Fully qualified image name (registry/repo/name).
    - name: tag
      type: string
      description: Image tag.
      default: latest
    - name: dockerfile
      type: string
      description: Path to the Dockerfile relative to the context.
      default: Dockerfile
    - name: context
      type: string
      description: Path to the build context relative to the workspace.
      default: app
    - name: build-target
      type: string
      description: Dockerfile multi-stage target to build.
      default: production

  workspaces:
    - name: source
      description: Workspace containing the source code.
    - name: registry-credentials
      description: Secret with .dockerconfigjson for registry auth.

  results:
    - name: image-digest
      description: Digest of the built image.
    - name: image-url
      description: Full image URL including digest.

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.context)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image):$(params.tag)
        - --digest-file=/tekton/results/image-digest
        - --skip-push-permission-check
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
  volumes:
    - name: docker-config
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
