apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push-image
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/tags: buildah, image-build
spec:
  description: Build a container image with Buildah and push to a registry.

  params:
    - name: image
      type: string
      description: Fully qualified image name (registry/repo/name).
    - name: tag
      type: string
      description: Image tag.
      default: latest
    - name: dockerfile
      type: string
      description: Path to the Dockerfile relative to the context.
      default: Dockerfile
    - name: context
      type: string
      description: Path to the build context relative to the workspace.
      default: app
    - name: build-target
      type: string
      description: Dockerfile multi-stage target to build.
      default: production

  workspaces:
    - name: source
      description: Workspace containing the source code.
    - name: registry-credentials
      description: Secret with .dockerconfigjson for registry auth.

  results:
    - name: image-digest
      description: Digest of the built image.
    - name: image-url
      description: Full image URL including digest.

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.35
      securityContext:
        privileged: true
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        IMAGE="$(params.image):$(params.tag)"
        CONTEXT="$(workspaces.source.path)/$(params.context)"
        DOCKERFILE="${CONTEXT}/$(params.dockerfile)"

        # Configure registry credentials
        mkdir -p /root/.docker
        cp "$(workspaces.registry-credentials.path)/.dockerconfigjson" /root/.docker/config.json

        buildah bud \
          --target "$(params.build-target)" \
          --tag "${IMAGE}" \
          --file "${DOCKERFILE}" \
          "${CONTEXT}"

        buildah push \
          --digestfile /tmp/image-digest \
          "${IMAGE}"

        DIGEST=$(cat /tmp/image-digest)
        echo -n "${DIGEST}" > "$(results.image-digest.path)"
        echo -n "${IMAGE}@${DIGEST}" > "$(results.image-url.path)"
        echo "Successfully pushed ${IMAGE}@${DIGEST}"
