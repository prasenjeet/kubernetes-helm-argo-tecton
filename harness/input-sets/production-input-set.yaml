inputSet:
  name: Production Deploy Input Set
  identifier: production_deploy_input_set
  orgIdentifier: default
  projectIdentifier: sample_project
  pipeline:
    identifier: Deploy_Sample_App
    variables:
      - name: imageTag
        type: String
        # Pin to a specific verified release tag for production promotions
        value: <+input>
    stages:
      - stage:
          identifier: Deploy_to_Staging
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: sample-app-image
                        sources:
                          - identifier: sample-app-image
                            spec:
                              tag: <+input>
      - stage:
          identifier: Deploy_to_Production
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: sample-app-image
                        sources:
                          - identifier: sample-app-image
                            spec:
                              tag: <+input>
