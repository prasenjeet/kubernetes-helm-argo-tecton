# Harness secrets that must be created in the Harness Secret Manager
# before applying pipelines, connectors, or triggers.
#
# Create via UI: Account/Org/Project → Settings → Secrets → + New Secret → Text
# Create via API: POST /ng/api/v2/secrets
#
# WARNING: Never store actual values in this file or in git.

secrets:
  - identifier: github_username
    name: GitHub Username
    description: GitHub account username for GHCR and repository access.
    type: SecretText

  - identifier: github_pat_token
    name: GitHub PAT Token
    description: |
      GitHub Personal Access Token with scopes:
        - repo (read:packages, write:packages for GHCR)
        - read:org  (for webhook validation)
    type: SecretText

  - identifier: harness_delegate_token
    name: Harness Delegate Token
    description: Token used by the Kubernetes delegate to authenticate with Harness.
    type: SecretText

  - identifier: webhook_secret
    name: GitHub Webhook Secret
    description: HMAC secret configured on the GitHub repository webhook.
    type: SecretText
